query getPromptModels($promptName: String!) {
  currentUser {
    copilot {
      providers {
        type
        models {
          id
          name
        }
      }
      models(promptName: $promptName) {
        defaultModel
        optionalModels {
          id
          name
        }
        proModels {
          id
          name
        }
      }
    }
  }
}
