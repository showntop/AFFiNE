mutation updatePrompt(
  $name: String!
  $messages: [CopilotPromptMessageInput!]!
  $model: String
  $optionalModels: [String!]
  $config: CopilotPromptConfigInput
) {
  updateCopilotPrompt(
    name: $name
    messages: $messages
    model: $model
    optionalModels: $optionalModels
    config: $config
  ) {
    name
    model
    optionalModels
    action
    config {
      frequencyPenalty
      presencePenalty
      temperature
      topP
    }
    messages {
      role
      content
      params
    }
  }
}
